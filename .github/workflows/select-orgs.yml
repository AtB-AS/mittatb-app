name: Select orgs
on:
  workflow_call:
    outputs:
      orgs:
        description: 'JSON array of orgs to build, e.g. ["troms","fram","nfk"]'
        value: ${{ jobs.select.outputs.orgs }}

env:
  # All orgs the store workflows can build. A release tag naming one or more orgs
  # (e.g. v1.91-rc3-troms-fram-nfk) builds only those; a tag naming none builds all.
  ORGS: atb nfk fram troms

jobs:
  select:
    name: Select orgs from tag
    runs-on: ubuntu-latest
    outputs:
      orgs: ${{ steps.orgs.outputs.orgs }}
    steps:
      - name: Select orgs
        id: orgs
        env:
          REF: ${{ github.ref_name }}
        run: |
          selected=()
          for org in $ORGS; do
            [[ "$REF" == *"$org"* ]] && selected+=("$org")
          done
          [ ${#selected[@]} -eq 0 ] && selected=($ORGS)
          echo "Building: ${selected[*]}"
          echo "orgs=$(printf '%s\n' "${selected[@]}" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
