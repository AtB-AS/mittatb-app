appId: ${APP_ID}
name: 'Mobile token'
onFlowStart:
  - runFlow:
      file: ../elements/loadElements.yaml
      label: 'Load elements'
  - launchApp:
      clearState: true
      permissions:
        location: deny
onFlowComplete:
  - stopApp
---
- runFlow:
    file: ../common/onboarding/loginPhone.yaml
    env:
      PHONE_NUMBER: ${PHONE_NUMBER}
      OTP: ${OTP}
    label: 'Login through onboarding'

- runFlow:
    file: mobileToken/mobileTokenInSettings.yaml
    label: 'Mobile token in settings'

- runFlow:
    file: mobileToken/mobileTokenInDebug.yaml
    label: 'Mobile token in debug'

- runFlow:
    file: ../common/logout.yaml
    label: 'Log out'
