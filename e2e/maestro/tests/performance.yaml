appId: ${APP_ID}
name: 'Tests for performance measurements'
onFlowStart:
  - runFlow:
      file: ../elements/loadElements.yaml
      label: 'Load elements'
  - launchApp:
      clearState: true
      permissions:
        location: deny
onFlowComplete:
  - stopApp
---
# Login
- runFlow:
    file: ../common/onboarding/loginPhone.yaml
    env:
      PHONE_NUMBER: ${PHONE_NUMBER}
      OTP: ${OTP}
      INSPECTION: false
    label: 'Login through onboarding'

# Travel search
- runFlow:
    file: travelSearch/simpleTravelSearch.yaml
    label: 'Travel search'

# Departures
- runFlow:
    file: departures/departureDetails.yaml
    label: 'Departures'

# Tickets
- runFlow:
    file: tickets/purchaseHistory.yaml
    label: 'Purchase history'

# Map
- runFlow:
    file: map.yaml
    label: 'Map'

- runFlow:
    file: ../common/logout.yaml
    label: 'Log out'
