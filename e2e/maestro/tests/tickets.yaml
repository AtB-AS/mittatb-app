appId: ${APP_ID}
name: 'Tickets with auth'
onFlowStart:
  - runFlow:
      file: ../elements/loadElements.yaml
      label: 'Load elements'
  - launchApp:
      clearState: true
      permissions:
        location: deny
onFlowComplete:
  - stopApp
---
- runFlow:
    file: ../common/onboarding/loginPhone.yaml
    label: 'Login through onboarding'

- runFlow:
    file: tickets/ticketPurchase.yaml
    label: 'Ticket purchase'

- runFlow:
    file: tickets/ticketInActiveTickets.yaml
    label: 'Assert purchased ticket'

- runFlow:
    file: tickets/ticketOnFrontpage.yaml
    label: 'Assert ticket on frontpage'

- runFlow:
    file: ../common/logout.yaml
    label: 'Log out'
