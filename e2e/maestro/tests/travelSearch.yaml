appId: ${APP_ID}
name: 'Travel search'
onFlowStart:
  - runFlow:
      file: ../elements/loadElements.yaml
      label: 'Load elements'
  - launchApp:
      clearState: true
      permissions:
        location: deny
onFlowComplete:
  - stopApp
---
- runFlow:
    file: ../common/onboarding/anonymous.yaml
    label: 'Onboarding'

- runFlow:
    file: travelSearch/simpleTravelSearch.yaml
    label: 'Simple travel search'

- runFlow:
    file: travelSearch/changeTimeForTravelSearch.yaml
    label: 'Travel search with time change'
