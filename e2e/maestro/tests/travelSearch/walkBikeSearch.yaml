appId: ${APP_ID}
name: 'Walk and bike travel search'
---
- evalScript: ${output.myFromPlace = 'Prinsens gate'}
- evalScript: ${output.myLongToPlace = 'Melhus skysstasjon'}
- evalScript: ${output.myShortToPlace = 'Solsiden'}

- tapOn:
    id: ${output.nav.menu.assistant}
    label: 'Navigate to Assistant tab'

# Long search: only bike
- runFlow:
    file: ../../common/locationSearch.yaml
    env:
      SEARCH_TYPE: 'from'
      SEARCH_TEXT: ${output.myFromPlace}
      ONLY_STOP_PLACE: 'true'
    label: 'Search from'
- runFlow:
    file: ../../common/locationSearch.yaml
    env:
      SEARCH_TYPE: 'to'
      SEARCH_TEXT: ${output.myLongToPlace}
      ONLY_STOP_PLACE: 'true'
    label: 'Search to'
- extendedWaitUntil:
    visible:
      id: ${output.tripSearch.bikeResult}
    timeout: 20000
    label: 'Wait for bike result'
- assertNotVisible:
    id: ${output.tripSearch.walkResult}
    label: 'Verify that walk result is not shown'
- tapOn:
    id: ${output.tripSearch.bikeResult}
    label: 'Open bike result'
- extendedWaitUntil:
    visible:
      id: ${output.tripDetails.content}
    timeout: 10000
    label: 'Wait for trip details'
- tapOn:
    id: ${output.nav.back}
    label: 'Go back'

# Short search: walk and bike
- runFlow:
    file: ../../common/locationSearch.yaml
    env:
      SEARCH_TYPE: 'to'
      SEARCH_TEXT: ${output.myShortToPlace}
      ONLY_STOP_PLACE: 'true'
    label: 'Search to'
- extendedWaitUntil:
    visible:
      id: ${output.tripSearch.bikeResult}
    timeout: 20000
    label: 'Wait for bike result'
- assertVisible:
    id: ${output.tripSearch.walkResult}
    label: 'Verify walk result'
- tapOn:
    id: ${output.tripSearch.bikeResult}
    label: 'Open bike result'
- extendedWaitUntil:
    visible:
      id: ${output.tripDetails.content}
    timeout: 10000
    label: 'Wait for trip details'
- tapOn:
    id: ${output.nav.back}
    label: 'Go back'
- tapOn:
    id: ${output.tripSearch.walkResult}
    label: 'Open walk result'
- extendedWaitUntil:
    visible:
      id: ${output.tripDetails.content}
    timeout: 10000
    label: 'Wait for trip details'
- tapOn:
    id: ${output.nav.back}
    label: 'Go back'

- tapOn:
    id: ${output.nav.menu.assistant}
    label: 'Navigate to Assistant tab'
